services:
  lab:
    build: .
    image: socket-lab
    hostname: lab
    # Your local checkout is shared here read-only: edit files on your
    # machine, then run "make" inside. The programs are built in /work.
    volumes:
      - .:/lab:ro
    # Lets the container read the mounted files on Linux hosts with SELinux
    # (Fedora, RHEL). Has no effect elsewhere.
    security_opt:
      - label=disable
    working_dir: /lab
    stdin_open: true
    tty: true
    # Reaps background processes started by start.sh.
    init: true
    # tcpdump needs raw packet sockets. Nothing else is required.
    cap_add:
      - NET_RAW
    # Program output + system calls (strace) + packets.
    command: ["bash", "start.sh", "strace"]

  # You are the client: nc in the CLIENT pane, you type the messages.
  nc:
    extends: lab
    command: ["bash", "start.sh", "nc"]

  # Only the program output and the packets.
  plain:
    extends: lab
    command: ["bash", "start.sh", "plain"]

  # The C code line by line (gdb); you control the pace with the keyboard.
  step:
    extends: lab
    command: ["bash", "start.sh", "step"]

  # Stepping through the code, plus the system calls each line makes.
  step_strace:
    extends: lab
    command: ["bash", "start.sh", "step_strace"]
